name: collect-civitai

on:
  schedule:
    - cron: "55 14 * * *"
    - cron: "25 15 * * 0"
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Maximum pages per model type (daily 20 / weekly 80)"
        required: false
        default: ""
      known_version_stop:
        description: "Consecutive known versions before stopping (daily 200 / weekly 1000)"
        required: false
        default: ""
      observed_date:
        description: "Observed date YYYY-MM-DD (default: UTC date)"
        required: false
        default: ""
      coverage_start_date:
        description: "Requested coverage start, YYYY-MM-DD"
        required: false
        default: ""
      coverage_end_date:
        description: "Requested coverage end, YYYY-MM-DD"
        required: false
        default: ""
      skip_active_totals:
        description: "Skip optional active inventory requests"
        type: boolean
        default: true
      bootstrap:
        description: "Initialize only a dataset with no existing history"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: civitai-dataset-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_DATASET_REPO: Shiba-2-shiba/civitai-model-version-trends
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-sync.txt
      - name: Install pinned dataset synchronization dependency
        run: python -m pip install -r requirements-sync.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Restore validated SQLite snapshot
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          BOOTSTRAP: ${{ github.event.inputs.bootstrap || 'false' }}
        run: |
          args=()
          if [ "$BOOTSTRAP" = "true" ]; then args+=(--bootstrap); fi
          python scripts/sync_dataset.py restore "${args[@]}"
      - name: Collect daily data
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '' }}
          KNOWN_VERSION_STOP: ${{ github.event.inputs.known_version_stop || '' }}
          OBSERVED_DATE: ${{ github.event.inputs.observed_date || '' }}
          COVERAGE_START_DATE: ${{ github.event.inputs.coverage_start_date || '' }}
          COVERAGE_END_DATE: ${{ github.event.inputs.coverage_end_date || '' }}
          SKIP_ACTIVE_TOTALS: ${{ github.event.inputs.skip_active_totals || 'true' }}
        run: python scripts/run_scheduled.py
      - name: Build and validate all export views
        run: |
          python scripts/build_exports.py
          cp data/exports/daily_counts.csv data/daily_counts.csv
      - name: Preserve immutable export batch for publication retry
        run: python scripts/sync_dataset.py prepare
      - name: Archive complete batch before external publication
        uses: actions/upload-artifact@v4
        with:
          name: civitai-export-batch-${{ github.run_id }}
          include-hidden-files: true
          retention-days: 7
          path: |
            data/exports/
            .verify/dataset_revision.json
            .verify/hf-upload/
      - name: Publish conditional dataset commit
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/sync_dataset.py retry
      - name: Commit the same export batch to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- data/daily_counts.csv data/exports/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Civitai publication and observation trends"
          git push
      - name: Preserve diagnostics and publication receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civitai-diagnostics-${{ github.run_id }}
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
          path: |
            data/errors.csv
            data/exports/export_manifest.json
            data/exports/coverage_daily.csv
            data/exports/series_diagnostics.csv
            .verify/dataset_revision.json
            .verify/hf-upload/publication_receipt.json
